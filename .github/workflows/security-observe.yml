name: security-observe

on:
  workflow_dispatch:

permissions:
  contents: read

# Node.js 24 opt-in (enforcement: 2026-06-02)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run security lint observation
        run: make lint-security-observe

      - name: Run vuln observation
        run: make vuln-observe

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sori-security-reports
          path: reports/
          if-no-files-found: warn
