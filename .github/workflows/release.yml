name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Node.js 24 opt-in (enforcement: 2026-06-02)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build sorictl release assets
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module state
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run release checks
        run: |
          make lint
          make test

      - name: Build release assets
        run: make release-dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          release_args=(--title "sori $tag" --notes "Automated sorictl release assets for $tag.")
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            if [[ "$tag" == *-* ]]; then
              gh release edit "$tag" --prerelease
            fi
          else
            gh release create "$tag" dist/* "${release_args[@]}"
          fi
