name: Tests

# No paths-ignore: the workflow always triggers so the required check
# "Run on Ubuntu" always reports a status. Docs-only changes are detected in-job
# and the work is skipped (green) — see .github/actions/detect-docs-only. (#29)
on:
  push:
  pull_request:

# Node.js 24 opt-in (enforcement: 2026-06-02)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: ./.github/actions/detect-docs-only

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module state
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          go mod tidy
          git diff --exit-code
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: make test

      - name: Run security lint guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint-security

      - name: Run vulnerability guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make vuln

      - name: Generate coverage report
        if: steps.changes.outputs.docs_only != 'true'
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: sori-coverage
          path: reports/

  registry-smoke:
    name: Registry Push/Pull Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # A real OCI registry implementation running in-job (no extra billed
      # runner time - services share the job's own runner allocation) so
      # the full push -> inspect -> fetch -> overwrite/skip-if-current
      # cycle (scripts/sorictl-registry-smoke.sh) exercises real registry
      # HTTP semantics on every PR, without needing live Harbor/GHCR/ECR
      # credentials. Auth-specific behavior (credential forwarding, real
      # cloud registry quirks) stays covered by the existing env-gated
      # integration tests, which this does not replace.
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: ./.github/actions/detect-docs-only

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run registry smoke cycle
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SORI_SMOKE_REF: "localhost:5000/sori-smoke:v1"
          SORI_SMOKE_EXTRA_FLAGS: "--plain-http"
        run: make smoke-cli
