name: Tests

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".github/**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".github/**/*.md"

# Node.js 24 opt-in (enforcement: 2026-06-02)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module state
        run: |
          go mod tidy
          git diff --exit-code
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Run tests
        run: make test

      - name: Run security lint guardrail
        run: make lint-security

      - name: Run vulnerability guardrail
        run: make vuln

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: sori-coverage
          path: reports/
