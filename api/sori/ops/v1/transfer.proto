// D01.4-r4 READ-ONLY PREP draft. Sori-local contract, not a platform-global wire.
syntax = "proto3";

package sori.ops.v1;

import "sori/ops/v1/common.proto";

option csharp_namespace = "Sori.Ops.V1";
option go_package = "github.com/HeaInSeo/sori/api/sori/ops/v1;opsv1";

// The server never opens a client path. Only bytes sent under a transfer_id
// reach the server storage root (E097). Every RPC below checks, on every
// call, that the caller's installation + principal equal the transfer's bound
// pair and that current permission holds; otherwise NOT_FOUND parity.
service TransferService {
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse);
  // Exactly one unacknowledged PutChunk per transfer (credit 1).
  rpc PutChunk(PutChunkRequest) returns (PutChunkResponse);
  rpc GetTransferCheckpoint(GetTransferCheckpointRequest) returns (GetTransferCheckpointResponse);
  // Re-verifies whole-file SHA-256 and the declarations server-side; FROZEN
  // only after full proof.
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse);
  rpc BeginDownload(BeginDownloadRequest) returns (BeginDownloadResponse);
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  // Releases transfer state. Not CancelJob; never cancels an accepted Job.
  rpc AbortTransfer(AbortTransferRequest) returns (AbortTransferResponse);
}

enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  TRANSFER_STATE_OPEN = 1;
  TRANSFER_STATE_COMMITTING = 2;
  TRANSFER_STATE_FROZEN = 3;
  TRANSFER_STATE_ABORTED = 4;
  TRANSFER_STATE_EXPIRED = 5;
  // FROZEN content accepted by a LOCAL_IMPORT Job. Payload may be moved into
  // the store; the frozen proof record is kept for the key's lifetime.
  TRANSFER_STATE_CONSUMED = 6;
}

enum Cardinality {
  CARDINALITY_UNSPECIFIED = 0;
  // Exactly one file.
  CARDINALITY_SINGLE = 1;
  // One or more files, ordered by canonical path bytes.
  CARDINALITY_MULTIPLE = 2;
  CARDINALITY_COMPOSITE = 3;
  CARDINALITY_SCATTER = 4;
}

// sori.member-declaration.v1 (D01.1 r1 section 2 / r2 A.8). Identity-bearing
// semantic layer; never derived from paths, suffixes or layout.
message MemberDeclaration {
  // 1..256 bytes UTF-8 NFC, no control characters, unique in the set.
  string semantic_key = 1;
  // 1..128 bytes. Compared after Unicode default case folding of the NFC
  // value: "executable", "tool" and "bundle" -> MEMBER_KIND_REJECTED.
  string role = 2;
  // 1..128 bytes, e.g. "fastq.gz".
  string data_format = 3;
  Cardinality cardinality = 4;
  // Must be 1.
  uint32 declaration_version = 5;
}

// Physical binding layer (non-identity).
message FileEntry {
  reserved 4;
  reserved "member_key";
  // Transport path, canonical relative-path encoding (UTF-8 NFC, '/', no
  // leading '/', no '.'/'..'/empty segment, <=1024 bytes, <=255 per segment).
  string canonical_path = 1;
  uint64 size_bytes = 2;
  // Whole-file SHA-256, 32 bytes.
  bytes sha256 = 3;
  // Index into BeginUploadRequest.declarations.
  uint32 member_index = 5;
}

message BeginUploadRequest {
  RequestHeader header = 1;
  OperationKey key = 2;
  // Must be "sori-local-import:v1".
  string accept_profile = 3;
  // Sorted by semantic_key UTF-8 bytes ascending, no duplicates, 1..4096.
  repeated MemberDeclaration declarations = 4;
  // Sorted by canonical_path UTF-8 bytes ascending, no duplicates, 1..65536.
  // file_index in the other RPCs is the position in this list.
  repeated FileEntry files = 5;
}

message BeginUploadResponse {
  // "xfer_" + 256-bit random (B.4).
  string transfer_id = 1;
  TransferLimits limits = 2;
  uint32 credit = 3;
}

message PutChunkRequest {
  RequestHeader header = 1;
  string transfer_id = 2;
  uint32 file_index = 3;
  uint64 offset = 4;
  bytes data = 5;
  // SHA-256 of data, 32 bytes.
  bytes chunk_sha256 = 6;
}

message PutChunkResponse {
  // Contiguous durably verified prefix for this file.
  uint64 verified_offset = 1;
  uint32 credit = 2;
}

message FileCheckpoint {
  uint32 file_index = 1;
  uint64 verified_offset = 2;
}

message GetTransferCheckpointRequest {
  RequestHeader header = 1;
  string transfer_id = 2;
}

message GetTransferCheckpointResponse {
  TransferState state = 1;
  repeated FileCheckpoint files = 2;
}

message CommitUploadRequest {
  RequestHeader header = 1;
  string transfer_id = 2;
}

message CommitUploadResponse {
  TransferState state = 1;
  VerificationState verification = 2;
}

message BeginDownloadRequest {
  RequestHeader header = 1;
  OperationKey key = 2;
  string revision_id = 3;
  // Exact PhysicalBinding; purpose is export.
  string binding_id = 4;
}

message BeginDownloadResponse {
  string transfer_id = 1;
  repeated FileEntry files = 2;
  TransferLimits limits = 3;
  uint32 credit = 4;
  // Declarations of the exported revision, indexed by FileEntry.member_index.
  repeated MemberDeclaration declarations = 5;
}

message GetChunkRequest {
  RequestHeader header = 1;
  string transfer_id = 2;
  uint32 file_index = 3;
  uint64 offset = 4;
  // <= limits.max_chunk_bytes.
  uint32 max_bytes = 5;
}

message GetChunkResponse {
  bytes data = 1;
  bytes chunk_sha256 = 2;
  bool eof = 3;
}

message AbortTransferRequest {
  RequestHeader header = 1;
  string transfer_id = 2;
}

message AbortTransferResponse {
  TransferState state = 1;
}
